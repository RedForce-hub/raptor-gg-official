<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAPTOR.GG | Plateforme eSport & Tournois Régionaux</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#0a0a0c',
                            card: '#121316',
                            border: '#1f2128',
                            hover: '#2a2d37',
                            neon: '#00FF66',
                            neonDark: '#00cc52',
                            text: '#f1f5f9',
                            muted: '#64748b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-cyber-black text-cyber-text font-sans antialiased selection:bg-cyber-neon selection:text-black min-h-screen flex flex-col">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-cyber-black/90 backdrop-blur-md border-b border-cyber-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- BRAND LOGO -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
                    <div class="w-10 h-10 bg-cyber-neon flex items-center justify-center rounded-lg text-black text-xl font-black shadow-[0_0_15px_rgba(0,255,102,0.4)]">
                        <i class="fa-solid fa-dragon"></i>
                    </div>
                    <span class="text-xl font-extrabold tracking-wider uppercase">
                        RAPTOR<span class="text-cyber-neon">.GG</span>
                    </span>
                </div>

                <!-- DESKTOP NAV -->
                <nav class="hidden md:flex space-x-1">
                    <button onclick="switchView('home')" id="nav-home" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all border border-transparent text-cyber-neon bg-cyber-neon/10 border-cyber-neon/30">
                        <i class="fa-solid fa-house mr-2"></i>Accueil
                    </button>
                    <button onclick="switchView('tournaments')" id="nav-tournaments" class="px-4 py-2 rounded-lg text-sm font-semibold text-cyber-muted hover:text-white transition-all">
                        <i class="fa-solid fa-trophy mr-2"></i>Tournois
                    </button>
                    <button onclick="switchView('community')" id="nav-community" class="px-4 py-2 rounded-lg text-sm font-semibold text-cyber-muted hover:text-white transition-all">
                        <i class="fa-solid fa-users mr-2"></i>Classements & Profils
                    </button>
                </nav>

                <!-- USER PROFILE / LOGIN -->
                <div class="flex items-center space-x-3">
                    <div id="user-profile-badge" class="hidden items-center space-x-2 bg-cyber-card border border-cyber-border px-3 py-1.5 rounded-lg">
                        <div class="w-7 h-7 rounded-full bg-cyber-neon/20 text-cyber-neon flex items-center justify-center text-xs font-bold" id="user-avatar-initial">J</div>
                        <div class="text-xs">
                            <div class="font-bold text-white flex items-center gap-1.5">
                                <span id="user-display-name">Joueur</span>
                                <span id="user-display-lvl" class="bg-cyber-neon text-black text-[9px] font-black px-1.5 py-0.2 rounded">LVL 1</span>
                            </div>
                            <div class="text-[10px] text-cyber-neon uppercase font-semibold" id="user-display-role">JOUEUR</div>
                        </div>
                    </div>

                    <button id="btn-auth" onclick="openAuthModal()" class="bg-cyber-neon text-black font-bold px-4 py-2 rounded-lg text-sm transition-all hover:bg-cyber-neonDark shadow-[0_0_12px_rgba(0,255,102,0.2)]">
                        Se Connecter
                    </button>

                    <button id="btn-create-tourney" onclick="openCreateModal()" class="hidden bg-cyber-card border border-cyber-neon text-cyber-neon font-bold px-4 py-2 rounded-lg text-sm transition-all hover:bg-cyber-neon hover:text-black">
                        <i class="fa-solid fa-plus mr-1"></i> Créer
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- VIEW: ACCUEIL -->
        <section id="view-home" class="space-y-10">
            <!-- HERO BANNER -->
            <div class="relative bg-cyber-card border border-cyber-border rounded-2xl p-6 sm:p-10 overflow-hidden">
                <div class="absolute right-0 top-0 bottom-0 w-1/2 opacity-10 pointer-events-none hidden md:flex items-center justify-center text-cyber-neon text-9xl">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <div class="relative z-10 max-w-2xl">
                    <span class="inline-block bg-cyber-neon/10 border border-cyber-neon/30 text-cyber-neon text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest mb-4">
                        <i class="fa-solid fa-bolt mr-1"></i> Plateforme eSport & Jeux Mobiles Régionale
                    </span>
                    <h1 class="text-3xl sm:text-5xl font
